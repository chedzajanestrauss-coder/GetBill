name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout files
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Cordova & Prepare Project
        run: |
          npm install -g cordova
          mkdir app_build
          cordova create app_build com.myapp.html "My App"
          cp config.xml app_build/config.xml
          cp icon.png app_build/icon.png
          rm -rf app_build/www/*
          cp -r *.html *.css *.js *.png *.jpg app_build/www/ 2>/dev/null || true

      - name: Build Android APK
        run: |
          cd app_build
          cordova platform add android
          cordova build android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-android-apk
          path: app_build/platforms/android/app/build/outputs/apk/debug/app-debug.apk
